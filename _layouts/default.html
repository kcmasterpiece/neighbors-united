<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page.title | default: site.title }}</title>
    <meta
      name="description"
      content="{{ page.description | default: site.description }}"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script data-goatcounter="https://kcmasterpiece.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    <link rel="icon" type="image/png" href="{{ '/content/images/nulogo.png' | relative_url }}" />
    <link rel="stylesheet" href="{{ '/styles.css' | relative_url }}" />
  </head>
  <body>
    <header class="site-header">
      <a href="{{ '/' | relative_url }}" class="brand" aria-label="Neighbors United home">
        <img src="{{ '/content/images/nulogo.png' | relative_url }}" alt="Neighbors United logo" class="brand-logo" />
      </a>
      <button class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="site-nav">
        Menu
      </button>
      <nav id="site-nav" class="site-nav" aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}" class="{% if page.url == '/' %}active{% endif %}">Home</a>
        <a href="{{ '/about/' | relative_url }}" class="{% if page.url == '/about/' %}active{% endif %}">About ENU</a>
        <a href="{{ '/project-overview/' | relative_url }}" class="{% if page.url == '/project-overview/' %}active{% endif %}">Sutter's Plan</a>
        <a href="{{ '/project-consequences/' | relative_url }}" class="{% if page.url == '/project-consequences/' %}active{% endif %}">Project Consequences</a>
        <a href="{{ '/get-involved/' | relative_url }}" class="{% if page.url == '/get-involved/' %}active{% endif %}">Get Involved</a>
        <a href="{{ '/resources/' | relative_url }}" class="{% if page.url == '/resources/' %}active{% endif %}">Resources</a>
        <a href="{{ '/contact/' | relative_url }}" class="{% if page.url == '/contact/' %}active{% endif %}">Contact Us</a>
      </nav>
    </header>

    <main class="page-main">
      {{ content }}
    </main>

    <footer class="site-footer">
      <img src="{{ '/content/images/nulogo.png' | relative_url }}" alt="Neighbors United logo" class="footer-logo" />
      <p>&copy; <span id="year"></span> {{ site.title }}. All rights reserved.</p>
    </footer>

    <script src="{{ '/script.js' | relative_url }}"></script>
  </body>
</html>
